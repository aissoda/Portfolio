<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeachKit • Home</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/main-content.css">
</head>

<body>
    <div id="sidebar-comp"></div>

    <main id="content" class="content">
        <div class="content-header">
            <h2 class="greetings">Hi, Welcome</h2>

            <div class="icon-btn" id="account-wrapper">
                <button class="icon-toggle" aria-expanded="false" aria-controls="icon-dropdown" aria-haspopup="true"
                    aria-label="Account menu">
                    <span class="icon" id="account-icon" data-name="Alice Johnson">A</span>
                    <span class="chevron">▾</span>
                </button>

                <div class="icon-menu" id="icon-dropdown">
                    <a href="#">Account settings</a>
                    <a href="#">Log out</a>
                </div>
            </div>
        </div>


        <section class="task-panel">
            <table class="task-tb">
                <thead>
                    <tr>
                        <th>Tasks</th>
                        <th>Status</th>
                        <th>Last Modified Date</th>
                        <th><span class="visually-hidden">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Prepare lesson plan</td>
                        <td><span class="status status-done">Completed</span></td>
                        <td>7 Oct 2026</td>
                        <td><button class="edit-btn" aria-label="Edit Prepare lesson plan">Edit</button></td>
                    </tr>
                    <tr>
                        <td>Grade quiz papers</td>
                        <td><span class="status status-pending">Pending</span></td>
                        <td>8 Oct 2026</td>
                        <td><button class="edit-btn" aria-label="Edit Grade quiz papers">Edit</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
